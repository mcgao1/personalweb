<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manchen Gao</title>
<link rel="stylesheet" href="scene.css?v=31">
<link rel="stylesheet" href="cockpit.css?v=1">
</head>
<body class="stage-distant">

<div class="sky" id="sky"></div>
<div class="monster-note" id="monster-note" role="button" tabindex="0" aria-label="Next background note">Some Things Are Still Unnamed.</div>

<main class="universe" id="universe" aria-label="A small monster planet">
  <section class="planet-world" id="planet-world" aria-label="Site map planet">
    <div class="planet-surface" id="planet-surface">
      <div class="planet-texture texture-one"></div>
      <div class="planet-texture texture-two"></div>
      <div class="planet-texture texture-three"></div>

      <button class="planet-region region-memories" type="button" data-label="not yet" aria-label="Memories, not yet">
        <span class="region-mark"></span>
      </button>
      <button class="planet-region region-people" type="button" data-label="not yet" aria-label="People, not yet">
        <span class="region-mark"></span>
      </button>
      <button class="planet-region region-scraps" type="button" data-label="not yet" aria-label="Scraps, not yet">
        <span class="region-mark"></span>
      </button>

      <img class="flower-combo-art" src="assets/flower-d-vector.svg" alt="" aria-hidden="true">

      <a class="garden-entry flower-entry flower-bachelor" href="bachelor/index.html" data-label="Bachelor" aria-label="Bachelor">
        <span class="flower-hit" aria-hidden="true"></span>
      </a>

      <a class="garden-entry flower-entry flower-master" href="master/projects.html" data-label="Master" aria-label="Master">
        <span class="flower-hit" aria-hidden="true"></span>
      </a>
    </div>
  </section>

  <div class="main-character" id="main-character" aria-label="Main character" role="img">
    <img src="assets/main-character.png" alt="">
    <span class="monster-lid monster-lid-left"></span>
    <span class="monster-lid monster-lid-right"></span>
  </div>
</main>

<section id="cockpit" data-active="none" aria-label="Spaceship cockpit">
  <div class="stage" aria-label="Spaceship sandwich layer preview">
    <div class="layer space-layer" aria-hidden="true">
      <div class="window-world">
        <video id="windowVideo" muted loop playsinline></video>
        <div class="scene scene-default is-active"></div>
        <div class="scene scene-hill" data-scene="hill"></div>
        <div class="scene scene-future" data-scene="future"></div>
        <div class="scene scene-exit" data-scene="exit"></div>
        <div class="scene scene-sweet" data-scene="sweet"></div>
      </div>
    </div>

    <div class="layer cockpit-layer" aria-hidden="true">
      <div class="window-frame"></div>
      <div class="dashboard"></div>
      <div class="seat"></div>
      <div class="monster"><img src="assets/main-character.png" alt="blue monster pilot"></div>
      <div class="props" aria-hidden="false">
        <button class="prop radio" type="button" data-prop="radio" aria-label="cassette radio"></button>
        <button class="prop jar" type="button" data-prop="jar" aria-label="eco specimen jar"></button>
        <button class="prop danger" type="button" data-prop="danger" aria-label="do not press red button"></button>
      </div>
    </div>

    <div class="layer ui-layer">
      <button class="ck-back" id="ck-back" type="button">back to the planet</button>
      <div class="title-scribble">SPACE<br>MONSTER<br>ARCHIVE</div>
      <button class="specimen hill-cube" type="button" data-scene="hill" aria-label="The Hill">
        <svg viewBox="0 0 150 90" aria-hidden="true">
          <rect x="17" y="13" width="116" height="66" rx="12" fill="rgba(255,255,255,.16)" stroke="#f7f2df" stroke-width="5"/>
          <path d="M20 64 C46 45 70 60 88 44 C104 29 119 42 132 32 L132 78 L20 78 Z" fill="#2a7b37"/>
          <ellipse cx="74" cy="66" rx="45" ry="12" fill="#4a2d19"/>
          <path d="M70 47 C78 29 97 23 112 22 C107 38 91 51 70 47 Z" fill="#db9d35" stroke="#131313" stroke-width="3"/>
          <path d="M75 45 C87 41 97 34 109 24" fill="none" stroke="#131313" stroke-width="3"/>
        </svg>
        <span class="tag">The Hill</span>
      </button>

      <button class="specimen future-cube" type="button" data-scene="future" aria-label="2002 Write The Future">
        <svg viewBox="0 0 150 90" aria-hidden="true">
          <rect x="22" y="20" width="103" height="55" rx="14" fill="rgba(121,221,255,.45)" stroke="#f7f2df" stroke-width="5"/>
          <rect x="37" y="31" width="67" height="32" rx="8" fill="#2b1149" stroke="#111" stroke-width="4"/>
          <circle cx="115" cy="39" r="6" fill="#d7ff35" stroke="#111" stroke-width="3"/>
          <circle cx="115" cy="58" r="6" fill="#ff7b26" stroke="#111" stroke-width="3"/>
          <text x="70" y="55" text-anchor="middle" fill="#d7ff35" font-size="22" font-weight="900">2002</text>
          <path d="M51 18 L44 4 M95 18 L108 4" stroke="#f7f2df" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span class="tag">2002</span>
      </button>

      <button class="specimen exit-cube" type="button" data-scene="exit" aria-label="Exit">
        <svg viewBox="0 0 150 90" aria-hidden="true">
          <path d="M28 24 H122 V66 H28 Z" fill="#42ff75" stroke="#050505" stroke-width="6"/>
          <text x="75" y="55" text-anchor="middle" fill="#061406" font-size="32" font-weight="900">EXIT</text>
          <path d="M39 24 C38 4 24 6 24 -7 M108 24 C109 5 127 7 130 -8" fill="none" stroke="#f7f2df" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/>
          <circle cx="22" cy="-8" r="4" fill="#ff7b26"/>
          <circle cx="132" cy="-8" r="4" fill="#ff7b26"/>
        </svg>
        <span class="tag">Exit</span>
      </button>

      <button class="specimen sweet-cube" type="button" data-scene="sweet" aria-label="Sweet Divine">
        <svg viewBox="0 0 150 90" aria-hidden="true">
          <path d="M24 18 C42 9 99 7 124 19 C136 35 133 60 120 72 C94 81 51 82 28 71 C14 56 13 34 24 18 Z" fill="rgba(255,180,78,.55)" stroke="#f7f2df" stroke-width="5"/>
          <path d="M93 24 H122 V48" fill="none" stroke="#fff8e0" stroke-width="7"/>
          <path d="M66 31 L72 45 L87 46 L75 55 L79 70 L66 61 L53 70 L57 55 L45 46 L60 45 Z" fill="#ff71c8" stroke="#050505" stroke-width="3"/>
          <circle cx="42" cy="34" r="7" fill="#79ddff"/>
          <circle cx="107" cy="61" r="6" fill="#d7ff35"/>
        </svg>
        <span class="tag">SweetDivine</span>
      </button>

      <button class="bubble" id="bubble" type="button">Hover a floating photo. The windshield changes its weather.</button>
      <div class="tap-note">hover / tap floating photos to switch the windshield</div>
    </div>
  </div>
</section>

<button class="replay-intro" id="replay-intro" type="button">far away</button>

<div class="hint" id="hint"></div>
<div class="tooltip" id="tooltip"></div>

<script src="scene.js?v=20"></script>
<script src="cockpit.js?v=1"></script>
</body>
</html>
