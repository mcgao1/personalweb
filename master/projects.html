<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-zh="硕士项目">Master · Portfolio</title>
<link rel="stylesheet" href="../poster-lettering.css?v=1">
<link rel="stylesheet" href="projects.css?v=11">
<script src="../poster-lettering.js?v=2" defer></script>

<link rel="stylesheet" href="../site-language.css?v=2">
<script src="../site-language.js?v=2"></script>
</head>
<body>

<div class="sky" aria-hidden="true">
  <span class="sky-orbit"></span>
  <span class="sky-spark" style="--x:9%;--y:35%;--size:15px;--tilt:12deg"></span>
  <span class="sky-spark" style="--x:27%;--y:12%;--size:24px;--ink:#f8a9bf;--tilt:-14deg"></span>
  <span class="sky-spark" style="--x:83%;--y:22%;--size:19px;--tilt:9deg"></span>
  <span class="sky-spark" style="--x:91%;--y:59%;--size:11px;--ink:#f8a9bf"></span>
  <span class="sky-spark" style="--x:18%;--y:83%;--size:11px"></span>
  <span class="sky-spark" style="--x:76%;--y:89%;--size:20px;--ink:#f8a9bf;--tilt:15deg"></span>
</div>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="poster-ink" x="-7%" y="-7%" width="114%" height="114%">
    <feTurbulence type="fractalNoise" baseFrequency=".064" numOctaves="2" seed="12" result="edge-noise"/>
    <feDisplacementMap in="SourceGraphic" in2="edge-noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="intro">
  <a class="back" data-poster-lettering href="../index.html" data-zh="← 回到星球">&larr; Back to the planet</a>
  <h1 data-poster-lettering data-zh="树丛里的六块路牌">Six signs, one dense thicket</h1>
  <p class="lead" data-poster-lettering data-zh="有些想法留在了树叶里，这六个长成了项目。点开一块路牌看看。">Not every idea makes it out of the leaves. These six did. Click a sign to see the whole thing.</p>
</div>

<div class="thicket" id="thicket"></div>

<script src="projects-data.js?v=6"></script>
<script>
  // Each project gets its own visual identity: a small preview of the
  // full page's palette and display font, so the sign out here already
  // hints at what's behind it.
  const THEMES = {
    thesis: {
      page: 'project-thesis.html', rotate: -6,
      bg: '#d9c9a3', ink: '#221c14', accent: '#b8505c',
      font: "'Kalam', cursive", fontUrl: 'Kalam:wght@700'
    },
    greenscreen: {
      page: 'project-greenscreen.html', rotate: 4,
      bg: '#ffde00', ink: '#0d0d0a', accent: '#c8102e',
      font: "'Anton', sans-serif", fontUrl: 'Anton'
    },
    sdg: {
      page: 'project-sdg.html', rotate: -3,
      bg: '#fdf3da', ink: '#171512', accent: '#e2362b',
      font: "'Chewy', cursive", fontUrl: 'Chewy'
    },
    greenspaces: {
      page: 'project-greenspaces.html', rotate: 5,
      bg: '#0f380f', ink: '#9bbc0f', accent: '#9bbc0f',
      font: "'Press Start 2P', cursive", fontUrl: 'Press+Start+2P'
    },
    policybrief: {
      page: 'project-policybrief.html', rotate: -5,
      bg: '#f3ece0', ink: '#182640', accent: '#3ea8dc',
      font: "'Fredoka', sans-serif", fontUrl: 'Fredoka:wght@600'
    },
    'siu-plastics': {
      page: 'project-siu-plastics.html', rotate: 3,
      bg: 'linear-gradient(160deg,#bfe8f5,#d8f5e3)', ink: '#1c3b46', accent: '#0d7ea6',
      font: "'Comfortaa', cursive", fontUrl: 'Comfortaa:wght@700'
    }
  };

  // pull in only the display fonts each mini-sign actually needs
  const fontLink = document.createElement('link');
  fontLink.rel = 'stylesheet';
  fontLink.href = 'https://fonts.googleapis.com/css2?family=' +
    Object.values(THEMES).map(function (t) { return t.fontUrl; }).join('&family=') +
    '&display=swap';
  document.head.appendChild(fontLink);

  // hand-placed positions so the six signs read clearly and don't
  // collide, scattered rather than gridded
  const LAYOUT = [
    { top: '4%',  left: '6%'  },
    { top: '2%',  left: '56%' },
    { top: '30%', left: '30%' },
    { top: '34%', left: '72%' },
    { top: '62%', left: '4%'  },
    { top: '66%', left: '52%' }
  ];

  const thicket = document.getElementById('thicket');
  const edges = ['intact', 'top-right', 'bottom-left', 'intact', 'top-right', 'bottom-left'];
  const returnKey = 'master-projects-return';

  function shuffle(items) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    return items;
  }

  const peelCounts = shuffle([2, 3, 4, 5, 6, 7]);

  function addEdgePixels(sign, count) {
    const layer = document.createElement('div');
    layer.className = 'sign-edge-pixels';
    layer.setAttribute('aria-hidden', 'true');

    const sides = shuffle(['top', 'right', 'bottom', 'left']);
    const sizes = shuffle([5, 6, 8, 9, 11, 13, 14]);
    const mask = ['linear-gradient(#000 0 0)'];

    for (let i = 0; i < count; i++) {
      const side = sides[i % sides.length];
      const horizontal = side === 'top' || side === 'bottom';
      // Place two chips in separate bands whenever they share an edge.
      const start = i >= sides.length ? 58 : 24;
      const end = i + sides.length < count ? 42 : 76;
      const position = Math.round(start + Math.random() * (end - start));
      const size = sizes[i];
      const normal = (9 + Math.random() * 18) * (side === 'top' || side === 'left' ? -1 : 1);
      const tangent = (Math.random() - .5) * 34;
      const x = horizontal ? tangent : normal;
      const y = horizontal ? normal : tangent;

      const chip = document.createElement('span');
      chip.className = 'sign-edge-pixel';
      chip.style.width = size + 'px';
      chip.style.height = size + 'px';
      chip.style[side] = '0';
      chip.style[horizontal ? 'left' : 'top'] = 'calc(' + position + '% - ' + (size * position / 100) + 'px)';
      chip.style.transitionDelay = Math.round(Math.random() * 80) + 'ms';
      chip.style.setProperty('--peel-offset',
        'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + (Math.random() * 26 - 13).toFixed(1) + 'deg)');
      layer.appendChild(chip);

      const anchor = horizontal ? position + '% ' + side : side + ' ' + position + '%';
      mask.push('linear-gradient(#000 0 0) ' + anchor + ' / ' + size + 'px ' + size + 'px no-repeat');
    }

    sign.style.setProperty('--peel-mask', mask.join(', '));
    sign.appendChild(layer);
  }

  function consumeProjectReturn() {
    try {
      const pending = sessionStorage.getItem(returnKey) === '1';
      sessionStorage.removeItem(returnKey);
      return pending;
    } catch {
      return false;
    }
  }

  const referrer = new URL(document.referrer || location.href);
  const fromProject = Object.values(THEMES).some(function (theme) {
    const project = new URL(theme.page, location.href);
    return project.origin === referrer.origin && project.pathname === referrer.pathname;
  });
  const reloaded = performance.getEntriesByType('navigation')[0]?.type === 'reload';
  const skipArrival = consumeProjectReturn() || (fromProject && !reloaded);
  document.body.classList.toggle('skip-arrival', skipArrival);

  function assembleSign(sign, stagger) {
    const layer = document.createElement('div');
    layer.className = 'sign-pixels';
    layer.setAttribute('aria-hidden', 'true');
    sign.appendChild(layer);

    const tileSize = 28;
    const width = sign.clientWidth;
    const height = sign.clientHeight;
    const columns = Math.ceil(width / tileSize);
    const rows = Math.ceil(height / tileSize);
    let lastArrival = 0;

    for (let row = 0; row < rows; row++) {
      for (let column = 0; column < columns; column++) {
        const x = column * tileSize;
        const y = row * tileSize;
        const tileWidth = Math.min(tileSize, width - x);
        const tileHeight = Math.min(tileSize, height - y);
        const pixel = document.createElement('div');
        pixel.className = 'sign-pixel';
        pixel.style.left = x + 'px';
        pixel.style.top = y + 'px';
        pixel.style.width = tileWidth + 'px';
        pixel.style.height = tileHeight + 'px';
        layer.appendChild(pixel);

        const offsetX = (x + tileWidth / 2 - width / 2) * .9 + (Math.random() - .5) * 104;
        const offsetY = (y + tileHeight / 2 - height / 2) * 1.3 + (Math.random() - .5) * 130;
        const missesTop = sign.dataset.edge === 'top-right' && row === 0 && column === columns - 1;
        const missesBottom = sign.dataset.edge === 'bottom-left' && row === rows - 1 && column === 0;
        const misses = missesTop || missesBottom;
        const delay = stagger + Math.random() * 220;
        const duration = 440 + Math.random() * 260;
        lastArrival = Math.max(lastArrival, delay + duration);

        pixel.animate([
          { opacity: 0, transform: 'translate(' + offsetX + 'px,' + offsetY + 'px) scale(.32)' },
          { opacity: .9, offset: .21 },
          {
            opacity: misses ? 0 : 1,
            transform: misses ? 'translate(' + (missesTop ? 20 : -20) + 'px,' + (missesTop ? -16 : 16) + 'px) scale(.45)' : 'none'
          }
        ], { duration, delay, easing: 'cubic-bezier(.23,.68,.28,1)', fill: 'both' });
      }
    }

    const revealAt = lastArrival - 140;
    setTimeout(function () { sign.classList.remove('is-unassembled'); }, revealAt);
    layer.animate([{ opacity: 1 }, { opacity: 0 }], {
      delay: revealAt + 60, duration: 180, fill: 'both'
    }).onfinish = function () { layer.remove(); };
  }

  const signObserver = !skipArrival && matchMedia('(prefers-reduced-motion: no-preference)').matches
    ? new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.intersectionRatio < .16) return;
        signObserver.unobserve(entry.target);
        assembleSign(entry.target, entry.target === thicket.firstElementChild ? 0 : 90);
      });
    }, { threshold: .16 })
    : null;

  window.PROJECTS.forEach(function (p, i) {
    const theme = THEMES[p.id];
    const pos = LAYOUT[i];

    const sign = document.createElement('a');
    sign.className = signObserver ? 'sign is-unassembled' : 'sign';
    sign.dataset.edge = edges[i];
    sign.href = theme.page;
    sign.style.top = pos.top;
    sign.style.left = pos.left;
    sign.style.setProperty('--rotate', theme.rotate + 'deg');
    sign.style.setProperty('--bg', theme.bg);
    sign.style.setProperty('--ink', theme.ink);
    sign.style.setProperty('--accent', theme.accent);
    sign.style.setProperty('--font', theme.font);
    sign.innerHTML =
      '<span class="sign-index">0' + (i + 1) + '</span>' +
      '<span class="sign-title">' + SiteLanguage.text(p.title, p.titleZh) + '</span>' +
      '<span class="sign-tag">' + SiteLanguage.text(p.tagline, p.taglineZh) + '</span>';
    sign.querySelector('.sign-title').dataset.en = p.title;
    sign.querySelector('.sign-title').dataset.zh = p.titleZh;
    sign.querySelector('.sign-tag').dataset.en = p.tagline;
    sign.querySelector('.sign-tag').dataset.zh = p.taglineZh;
    addEdgePixels(sign, peelCounts[i]);
    thicket.appendChild(sign);
    if (signObserver) signObserver.observe(sign);
  });

  thicket.addEventListener('click', function (event) {
    if (!event.target.closest('.sign') || event.defaultPrevented || event.button !== 0 ||
        event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    try { sessionStorage.setItem(returnKey, '1'); } catch {}
  });

  window.addEventListener('pageshow', function (event) {
    if (!event.persisted) return;
    consumeProjectReturn();
    document.body.classList.add('skip-arrival');
    signObserver?.disconnect();
    thicket.querySelectorAll('.is-unassembled').forEach(function (sign) {
      sign.classList.remove('is-unassembled');
    });
    thicket.querySelectorAll('.sign-pixels').forEach(function (layer) { layer.remove(); });
  });
</script>
</body>
</html>
