<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Project · loading</title>
<link rel="stylesheet" href="projects.css">
<link rel="stylesheet" href="project.css">
</head>
<body>

<div class="sky"></div>

<div class="wrap narrow" id="content">
  <a class="back" href="projects.html">&larr; All projects</a>
</div>

<script src="projects-data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const project = window.PROJECTS.find(function (p) { return p.id === id; });
  const content = document.getElementById('content');

  if (!project) {
    content.insertAdjacentHTML('beforeend', '<p style="margin-top:24px;color:rgba(238,242,248,0.6)">Couldn\'t find that project. Back to the list?</p>');
  } else {
    document.getElementById('page-title').textContent = project.title;

    function imgBlock(img) {
      const isPdf = /\.pdf$/i.test(img.src);
      if (isPdf) {
        return '<a class="pdf-link" href="' + img.src + '" target="_blank" rel="noopener">' +
          'View PDF: ' + img.caption + ' ↗</a>';
      }
      return '<figure><img src="' + img.src + '" alt="' + img.caption + '" loading="lazy">' +
        '<figcaption>' + img.caption + '</figcaption></figure>';
    }

    const processHtml = project.process.map(function (step) {
      return '<li>' + step + '</li>';
    }).join('');

    const imagesHtml = (project.images && project.images.length)
      ? '<h2>Materials</h2><div class="gallery">' + project.images.map(imgBlock).join('') + '</div>'
      : '';

    const videoNoteHtml = project.videoNote
      ? '<p class="note">' + project.videoNote + '</p>'
      : '';

    content.insertAdjacentHTML('beforeend',
      '<div class="project-header">' +
      '<div class="eyebrow">' + project.subtitle + '</div>' +
      '<h1>' + project.title + '</h1>' +
      '<p class="tagline">' + project.tagline + '</p>' +
      '<p class="role"><span>Role</span>' + project.role + '</p>' +
      '</div>' +
      '<article>' +
      '<h2>Background</h2><p>' + project.background + '</p>' +
      '<h2>What I did</h2><ol>' + processHtml + '</ol>' +
      '<h2>Result</h2><p>' + project.result + '</p>' +
      '<h2>Methods &amp; tools</h2><p class="tech">' + project.tech + '</p>' +
      imagesHtml +
      videoNoteHtml +
      '</article>'
    );
  }
</script>
</body>
</html>
